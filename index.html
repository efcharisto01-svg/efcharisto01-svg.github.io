<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[이름] | 개인 소개</title>
  <meta name="description" content="[소개 문구]">
  <style>
    :root {
      --bg: #fafaf7;
      --surface: #ffffff;
      --text: #1d1d1b;
      --muted: #62625c;
      --accent: #2f5d50;
      --border: #e4e3dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1c1f25;
        --text: #ecece8;
        --muted: #a0a29b;
        --accent: #8fc4b2;
        --border: #2c3038;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.7;
    }
    a { color: var(--accent); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header.nav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    header.nav .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; padding-bottom: 12px; }
    .brand { font-weight: 700; text-decoration: none; color: var(--text); }
    nav a { margin-left: 16px; text-decoration: none; color: var(--muted); font-size: 0.95rem; }
    nav a:hover { color: var(--accent); }
    .hero { padding: 72px 0 48px; }
    .hero h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.15; margin: 0 0 12px; }
    .hero p { font-size: clamp(1.05rem, 3.5vw, 1.3rem); color: var(--muted); margin: 0; }
    section { padding: 40px 0; border-top: 1px solid var(--border); }
    h2 { font-size: 1.3rem; margin: 0 0 16px; color: var(--accent); }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    ul.contact { list-style: none; padding: 0; margin: 0; }
    ul.contact li { padding: 6px 0; }
    ul.contact span { display: inline-block; min-width: 4.5em; color: var(--muted); }
    footer { padding: 32px 0 48px; color: var(--muted); font-size: 0.85rem; text-align: center; border-top: 1px solid var(--border); }
    @media (max-width: 480px) {
      nav a { margin-left: 12px; font-size: 0.88rem; }
      .hero { padding: 48px 0 32px; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="#top">[이름]</a>
      <nav>
        <a href="#about">소개</a>
        <a href="#projects">프로젝트</a>
        <a href="#contact">연락처</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="top">
    <div class="hero">
      <h1>[이름]</h1>
      <p>[한 줄 소개]</p>
    </div>

    <section id="about">
      <h2>소개</h2>
      <p>[소개 문구] 여기에 자신을 소개하는 글을 적어주세요. 관심 분야, 하는 일, 좋아하는 것 등을 자유롭게 쓸 수 있습니다.</p>
    </section>

    <section id="projects">
      <h2>프로젝트</h2>
      <div class="grid">
        <article class="card">
          <h3>[프로젝트 이름 1]</h3>
          <p>[프로젝트 설명]</p>
        </article>
        <article class="card">
          <h3>[프로젝트 이름 2]</h3>
          <p>[프로젝트 설명]</p>
        </article>
        <article class="card">
          <h3>[프로젝트 이름 3]</h3>
          <p>[프로젝트 설명]</p>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>연락처</h2>
      <ul class="contact">
        <li><span>이메일</span> [이메일 주소]</li>
        <li><span>GitHub</span> <a href="https://github.com/efcharisto01-svg">github.com/efcharisto01-svg</a></li>
        <li><span>기타</span> [SNS 또는 블로그 링크]</li>
      </ul>
    </section>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> [이름]</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
