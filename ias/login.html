<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · IAS</title>
<link rel="icon" href="data:,">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/ias.css">
</head>
<body>
<main class="center">
  <form class="auth-card glass rise" id="f" novalidate>
    <h1>IAS 그룹웨어</h1>
    <p class="muted">회사 계정으로 로그인하세요.</p>
    <label class="lbl" for="tenant">회사</label>
    <select class="field" id="tenant"></select>
    <label class="lbl" for="uid">아이디</label>
    <input class="field" id="uid" autocomplete="username" autocapitalize="none" required>
    <label class="lbl" for="pw">비밀번호</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" required>
    <p class="error" id="err" role="alert"></p>
    <button class="btn btn-primary" id="go" type="submit">로그인</button>
    <div class="demo-hint" id="demo">
      체험용 데모입니다. 데이터는 이 브라우저에만 저장됩니다.<br>
      아이디 <code>admin</code> · <code>kim</code> · <code>newbie</code>, 비밀번호 <code>Demo1234!</code><br>
      <button class="link" type="button" id="reset">데모 데이터 초기화</button>
    </div>
  </form>
</main>
<script src="js/core.js"></script>
<script src="js/backend-local.js"></script>
<script src="js/backend-http.js"></script>
<script>
(function () {
  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  var tenant = document.getElementById('tenant'), uid = document.getElementById('uid'), pw = document.getElementById('pw');
  if (IAS.config.backend !== 'local') document.getElementById('demo').hidden = true;

  IAS.api.me().then(function () { location.replace('home.html'); }, function () {});
  IAS.api.tenants().then(function (list) {
    list.forEach(function (t) { tenant.append(IAS.h('option', { value: t.id, text: t.name })); });
  });

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    [uid, pw].forEach(function (x) { x.classList.toggle('invalid', !x.value); });
    if (!uid.value || !pw.value) { err.textContent = '아이디와 비밀번호를 입력해 주세요.'; return; }
    go.disabled = true; err.textContent = '';
    try {
      var me = await IAS.api.login({ tenant: tenant.value, userId: uid.value.trim(), password: pw.value });
      location.replace(me.mustChange ? 'change-password.html' : 'home.html');
    } catch (ex) {
      err.textContent = ex.message;
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      pw.value = ''; go.disabled = false;
    }
  });
  document.getElementById('reset').addEventListener('click', async function () {
    if (!confirm('이 브라우저의 데모 데이터를 처음 상태로 되돌릴까요?')) return;
    await IAS.api.resetDemo(); IAS.toast('초기화했습니다.');
  });
})();
</script>
</body>
</html>
