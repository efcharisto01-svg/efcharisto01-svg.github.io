<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 변경 · IAS</title>
<link rel="icon" href="data:,">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/ias.css">
</head>
<body>
<main class="center">
  <form class="auth-card glass rise" id="f" novalidate>
    <h1>비밀번호 변경</h1>
    <p class="muted" id="why"></p>
    <label class="lbl" for="cur">현재 비밀번호</label>
    <input class="field" id="cur" type="password" autocomplete="current-password">
    <label class="lbl" for="nw">새 비밀번호 (8자 이상, 영문+숫자)</label>
    <input class="field" id="nw" type="password" autocomplete="new-password">
    <label class="lbl" for="nw2">새 비밀번호 확인</label>
    <input class="field" id="nw2" type="password" autocomplete="new-password">
    <p class="error" id="err" role="alert"></p>
    <button class="btn btn-primary" type="submit">변경</button>
    <a class="btn btn-glass" id="skip" href="home.html" hidden>취소</a>
  </form>
</main>
<script src="js/core.js"></script>
<script src="js/backend-local.js"></script>
<script src="js/backend-http.js"></script>
<script src="js/shell.js"></script>
<script>
(async function () {
  var me = await IAS.auth.require({ allowMustChange: true });
  var err = document.getElementById('err');
  document.getElementById('why').textContent = me.mustChange ? '처음 로그인했습니다. 비밀번호를 바꿔야 계속 사용할 수 있습니다.' : '새 비밀번호를 입력해 주세요.';
  document.getElementById('skip').hidden = me.mustChange;
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var cur = document.getElementById('cur').value, nw = document.getElementById('nw').value, nw2 = document.getElementById('nw2').value;
    if (nw !== nw2) { err.textContent = '새 비밀번호 확인이 일치하지 않습니다.'; return; }
    try { await IAS.api.changePassword({ current: cur, next: nw }); location.replace('home.html'); }
    catch (ex) { err.textContent = ex.message; }
  });
})();
</script>
</body>
</html>
