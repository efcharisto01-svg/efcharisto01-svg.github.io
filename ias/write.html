<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 · IAS</title>
<link rel="icon" href="data:,">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/ias.css">
</head>
<body>
<main class="page">
  <form class="card glass" id="f" novalidate>
    <label class="lbl" for="board">게시판</label>
    <select class="field" id="board"></select>
    <label class="lbl" for="title">제목</label>
    <input class="field" id="title" maxlength="120">
    <label class="lbl" for="body">내용</label>
    <textarea class="textarea" id="body" maxlength="5000"></textarea>
    <p class="error" id="err" role="alert"></p>
    <button class="btn btn-primary" type="submit">등록</button>
  </form>
</main>
<script src="js/core.js"></script>
<script src="js/backend-local.js"></script>
<script src="js/backend-http.js"></script>
<script src="js/shell.js"></script>
<script>
(async function () {
  var me = await IAS.auth.require();
  IAS.topbar.mount({ title: '글쓰기', me: me, back: 'board.html' });
  var sel = document.getElementById('board'), err = document.getElementById('err');
  (await IAS.api.boards()).forEach(function (b) { sel.append(IAS.h('option', { value: b.id, text: b.name })); });
  sel.value = IAS.qs('board') || 'free';
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var t = document.getElementById('title'), b = document.getElementById('body');
    t.classList.toggle('invalid', !t.value.trim()); b.classList.toggle('invalid', !b.value.trim());
    try {
      var r = await IAS.api.createPost({ board: sel.value, title: t.value, body: b.value });
      location.replace('post.html?id=' + r.id);
    } catch (ex) { err.textContent = ex.message; }
  });
})();
</script>
</body>
</html>
