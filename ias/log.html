<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변경 기록 · IAS</title>
<link rel="icon" href="data:,">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/ias.css">
</head>
<body>
<main class="page">
  <div class="hboard glass" id="rows"></div>
</main>
<script src="js/core.js"></script>
<script src="js/backend-local.js"></script>
<script src="js/backend-http.js"></script>
<script src="js/shell.js"></script>
<script>
(async function () {
  var h = IAS.h;
  var me = await IAS.auth.require({ admin: true });
  IAS.topbar.mount({ title: '변경·보안 기록', me: me, back: 'home.html' });
  var rows = document.getElementById('rows');
  var list = await IAS.api.listAudit({ limit: 200 });
  var cat = { data: '데이터', admin: '관리', security: '보안' };
  list.forEach(function (a) {
    rows.append(h('div', { class: 'log-row' }, h('span', { class: 'muted', text: IAS.fmtDate(a.at) }), h('span', null, h('span', { class: 'tag', text: cat[a.category] || a.category })), h('span', { text: a.user }), h('span', { text: a.summary })));
  });
})();
</script>
</body>
</html>
