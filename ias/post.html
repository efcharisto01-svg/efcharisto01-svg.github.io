<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시글 · IAS</title>
<link rel="icon" href="data:,">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/ias.css">
</head>
<body>
<main class="page">
  <article class="card glass" id="post"></article>
  <section class="card glass" id="comments"></section>
</main>
<script src="js/core.js"></script>
<script src="js/backend-local.js"></script>
<script src="js/backend-http.js"></script>
<script src="js/shell.js"></script>
<script>
(async function () {
  var h = IAS.h;
  var me = await IAS.auth.require();
  IAS.topbar.mount({ title: '게시글', me: me, back: 'board.html' });
  var id = IAS.qs('id');
  var post = document.getElementById('post'), box = document.getElementById('comments');

  async function load() {
    var p;
    try { p = await IAS.api.getPost(id); } catch (e) { post.replaceChildren(h('p', { text: e.message })); box.hidden = true; return; }
    post.replaceChildren(h('h2', { text: p.title }), h('small', { class: 'muted', text: p.authorName + ' · ' + IAS.fmtDate(p.at) }), h('div', { class: 'post-body', text: p.body }));
    var ta = h('textarea', { class: 'textarea', style: 'min-height:80px', maxlength: '1000', placeholder: '댓글을 입력하세요' });
    box.replaceChildren(
      h('h3', { text: '댓글 ' + p.comments.length }),
      ...p.comments.map(function (c) { return h('div', { class: 'cmt' }, h('small', { text: c.authorName + ' · ' + IAS.fmtDate(c.at) }), h('p', { text: c.body })); }),
      ta,
      h('button', { class: 'btn btn-primary', style: 'margin-top:10px', type: 'button', onclick: async function () {
        try { await IAS.api.addComment(id, ta.value); await load(); } catch (e) { IAS.toast(e.message); }
      } }, '댓글 등록'));
  }
  load();
})();
</script>
</body>
</html>
